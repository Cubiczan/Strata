name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Lint (ruff)
        run: ruff check src/strata/mcp src/strata/maturity/load.py src/strata/maturity/__init__.py tests/test_mcp.py

      - name: Run tests
        env:
          STRATA_TEST_DB: "sqlite:///./strata-test.sqlite"
        run: pytest --cov

      - name: Prepare @cubiczan/strata-mcp packaging (do not publish)
        working-directory: mcp
        run: |
          npm install
          npm run build
          PKG="$(node -p 'require("./package.json").version')"
          SRV="$(node -p 'require("./server.json").version')"
          PKGREF="$(node -p 'require("./server.json").packages[0].version')"
          test "$PKG" = "$SRV"
          test "$PKG" = "$PKGREF"
          LEN="$(node -p 'require("./server.json").description.length')"
          test "$LEN" -le 100

      - name: Upload coverage report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            .coverage
            htmlcov/
          if-no-files-found: ignore
